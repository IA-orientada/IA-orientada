<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Socrático - GitHub Models</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; background: #f4f4f9; }
        #chat-box { background: white; height: 400px; overflow-y: auto; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 8px; max-width: 80%; line-height: 1.4; }
        .user-msg { background: #007bff; color: white; margin-left: auto; }
        .ai-msg { background: #e9ecef; color: black; margin-right: auto; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <h2>Tutor Socrático (GitHub Models)</h2>
    <div id="chat-box">
        <div class="message ai-msg">¡Hola! Soy tu tutor. Dime, ¿qué problema o tema de estudio deseas revisar hoy?</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Escribe tu duda o respuesta..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        // ⚠️ REEMPLAZA CON TU TOKEN DE GITHUB (ghp_... o github_pat_...)
        const GITHUB_TOKEN = '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'; 
        
        // Modelo disponible en GitHub Models (puedes usar "meta-llama-3.1-8b-instruct", "gpt-4o-mini", "Phi-3-medium-4k-instruct")
        const MODEL_NAME = "meta-llama-3.1-8b-instruct";

        const systemPrompt = "Eres un tutor socrático experto para estudiantes. Tu objetivo es guiar, orientar y enseñar, NUNCA dar la solución directa a un problema. Si un estudiante pide ayuda, hazle preguntas para que descubra el procedimiento. Si da un resultado incorrecto, guíalo amablemente a encontrar su propio error paso a paso.";

        let messagesHistory = [
            { role: "system", content: systemPrompt }
        ];

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            appendMessage('user-msg', messageText);
            inputField.value = '';

            messagesHistory.push({ role: "user", content: messageText });

            try {
                const response = await fetch('https://models.inference.ai.azure.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GITHUB_TOKEN}`
                    },
                    body: JSON.stringify({
                        messages: messagesHistory,
                        model: MODEL_NAME,
                        temperature: 0.7,
                        max_tokens: 800
                    })
                });

                if (!response.ok) {
                    throw new Error(`Error en la API: ${response.status}`);
                }

                const data = await response.json();
                const aiReply = data.choices[0].message.content;

                appendMessage('ai-msg', aiReply);
                messagesHistory.push({ role: "assistant", content: aiReply });

            } catch (error) {
                appendMessage('ai-msg', 'Error al conectar con GitHub Models. Verifica tu token o la consola.');
                console.error(error);
            }
        }

        function appendMessage(className, text) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
